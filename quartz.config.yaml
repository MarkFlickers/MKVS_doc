# yaml-language-server: $schema=./quartz/plugins/mkvs-plugins.schema.json
#
# Конфигурация Quartz v5 для сайта «МКВС - лабораторные работы».
# Репозиторий — форк Quartz; этот файл лежит в его корне, рядом с content/.
# Обзор надстройки и порядок обновления от upstream — в README.md.
#
# Цветовая схема подобрана под оригинальные PDF-пособия:
#   #0f45c7 — фирменный синий МИЭТ (взят пипеткой из логотипа в PDF)
#   белый лист, чёрный текст, синие ссылки и акценты.
# Шрифты — суперсемья PT от ParaType плюс JetBrains Mono на код:
#   заголовки -> PT Serif
#   текст     -> PT Sans
#   код       -> JetBrains Mono
# Отказ от пары Montserrat/Carlito (аналогов Century Gothic и Calibri из PDF)
# сознательный. У Montserrat кириллица рисовалась отдельно от латиницы и
# заметно шире неё, поэтому в смешанных заголовках вида «Часть 5. Создание и
# запуск приложения для Native-платформы» ширина букв на стыке скачет. У PT
# наоборот: кириллица первична, латиницу подгоняли под неё. Засечки в
# заголовках заодно делают вкладку браузера узнаваемой.

configuration:
  pageTitle: Микроконтроллеры и встраиваемые системы
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: ru-RU
  baseUrl: markflickers.github.io/MKVS_doc
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Веса указаны явно, и это не косметика. Quartz по умолчанию просит для
    # body веса [400, 600], а Google Fonts молча выбрасывает вес, которого у
    # семейства нет, и отдаёт остальное. У PT Sans (как и у прежнего Carlito)
    # есть только 400 и 700 — с дефолтом на сайт приезжал бы один вес 400, а
    # весь полужирный браузер дорисовывал бы сам, обводя контур. Вес 600,
    # который просит проводник слева, по правилам подбора корректно ляжет
    # на 700.
    typography:
      header:
        name: PT Serif
        weights: [400, 700]
      body:
        name: PT Sans
        weights: [400, 700]
        includeItalic: true # подписи «Рисунок 1 – …» набраны курсивом
      code:
        name: JetBrains Mono
        weights: [400, 700]
    colors:
      lightMode:
        light: "#ffffff" # фон страницы — белый лист, как в PDF
        lightgray: "#e3e6ec" # линейки, границы таблиц
        gray: "#9aa2b1" # второстепенный текст
        darkgray: "#1a1a1a" # основной текст
        dark: "#000000" # заголовки
        secondary: "#0f45c7" # фирменный синий МИЭТ: ссылки, акценты
        tertiary: "#3f6fd8" # hover
        highlight: rgba(15, 69, 199, 0.08)
        textHighlight: "#fff23688"
      darkMode:
        light: "#16181d"
        lightgray: "#2c3038"
        gray: "#6a7280"
        darkgray: "#d8dbe0"
        dark: "#f2f4f7"
        secondary: "#7ea2f0"
        tertiary: "#a8c0f7"
        highlight: rgba(126, 162, 240, 0.12)
        textHighlight: "#b3aa0288"

plugins:
  # ===== обработка markdown ==============================================
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  # Подсветка кода. Даёт title="...", showLineNumbers, подсветку строк {1-3}
  # и штатную кнопку «копировать в буфер» на каждом блоке кода.
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 6
      minEntries: 0
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  # ВНИМАНИЕ: именно этот плагин парсит frontmatter (`title:`, `tags:` и т.д.)
  # и кладёт его в file.data.frontmatter. Без него заголовки страниц теряются,
  # а блок `---` рендерится в текст. Отключать нельзя.
  # hidePropertiesView прячет саму таблицу свойств над текстом (лишний шум
  # для пособия), оставляя разбор frontmatter работать.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  # ===== фильтры =========================================================
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false

  # ===== эмиттеры (именно они порождают HTML-страницы) ===================
  - source: "@quartz-community/content-page"
    enabled: true
  # Титульная страница работы (labNN/index.md) — folder-страница, поэтому под
  # её текстом плагин выводит список вложенных страниц: он служит содержанием
  # работы. Служебная строка «в этой папке N элементов» там лишняя.
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      showFolderCount: false
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900

  # ===== компоненты страницы ============================================
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: ""
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Дата изменения и время чтения над заголовком. Студенту дата правки
  # страницы ни о чём не говорит — выключено. Сама дата при этом никуда не
  # делась: created-modified-date по-прежнему отдаёт её в sitemap.xml.
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  # Граф связей для линейного учебного курса скорее мешает — выключен.
  - source: "@quartz-community/graph"
    enabled: false

  # Подвал свой — MkvsFooter, подключается в quartz.ts вместе с годом, версией
  # сайта и ссылкой на репозиторий. Штатный пишет «Создано с помощью Quartz» и
  # версию Quartz, и настроить эту строку нельзя.
  - source: "@quartz-community/footer"
    enabled: false

  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/stacked-pages"
    enabled: false

  # ===== служебные =======================================================
  # Плагин мостит систему шрифтов Obsidian (--h1-font … --h6-font) на систему
  # Quartz (--headerFont, --bodyFont, --codeFont). Шрифты сайту даёт ядро из
  # configuration.theme.typography выше, поэтому плагину нужно запретить
  # грузить свои: без options он подставляет собственные дефолты (Schibsted
  # Grotesk, Source Sans Pro, IBM Plex Mono) и вешает в <head> вторую таблицу
  # стилей Google Fonts с тремя семействами, которые на сайте не используются.
  # fontOrigin: local — «шрифты уже есть, ничего не подключать».
  # Имена дублируют typography, чтобы переменные плагина не разошлись с
  # ядром, если он всё же успеет выставить свои.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: local
      useThemeFonts: false
      header: PT Serif
      body: PT Sans
      code: JetBrains Mono

layout:
  byPageType:
    content: {}
    # Страница лабораторной работы — это content/labNN/index.md, а такой slug
    # (оканчивается на «/index») матчится типом страницы folder, а не content.
    # Поэтому правую колонку здесь НЕ очищаем: именно из неё берётся штатное
    # оглавление Quartz (@quartz-community/table-of-contents), как на титульной
    # странице. Проводник слева остаётся только под список лабораторных работ.
    folder: {}
    tag:
      positions:
        right: []
    canvas: {}
    bases: {}
    "404":
      positions:
        header: []
        beforeBody: []
        left: []
        right: []
