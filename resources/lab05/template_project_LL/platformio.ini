; Инструкция по работе с проектом
;
; ВАРИАНТ 1 - РЕКОМЕНДОВАННЫЙ
;   1. Проверить, прошит ли загрузчик: если после сброса или подключения платы
;      на светодиодах бегущий огонь, то прошит.
;   2. Если загрузчик не прошит, выбрать окружение bootloader и прошить
;      (кнопка -> в панели состояния).
;   3. Далее выбираете окружение app_in_ram:
;       - запускать отладку (F5);
;       - запускать без отладки (кнопка -> в панели состояния): загрузчик
;         запустит программу автоматически через 5 секунд.
;   ВАЖНО: функцию main() начинать с __enable_irq();
;
; ВАРИАНТ 2 - ЕСЛИ ВАРИАНТ 1 НЕ РАБОТАЕТ
;   1. Выбираете окружение app_in_flash - программа занимает место загрузчика
;      и запускается сразу после сброса:
;       - запускать отладку (F5);
;       - запускать без отладки (кнопка -> в панели состояния).
;
; ЕСЛИ НЕ ПРОШИВАЕТСЯ ЗАГРУЗЧИК ИЛИ ПРОГРАММА app_in_flash
;   1. Удерживайте синюю кнопку, затем нажмите RESET, синюю кнопку не отпускайте.
;   2. Прошиваете.
;   3. Отпускаете синюю кнопку.

[platformio]
description = "шаблон проекта LL v.2026.3"
default_envs = app_in_ram

; глобальные и общие параметры
[env]
platform = ststm32
board = nucleo_h745zi_q
framework = cmsis
build_flags = -std=c11 -Wall -Wextra
              -D CORE_CM7 -D PWR_DIRECT_SMPS_SUPPLY -D HSE_VALUE=8000000
              -D USE_FULL_LL_DRIVER
              -D USE_FULL_ASSERT
board_build.cmsis.startup_file = broken_path
board_build.cmsis.system_file = broken_path
monitor_speed = 115200
test_speed = 115200
test_filter = target/*
test_framework = custom ; использовать test_custom_runner.py из папки test
check_tool = cppcheck
check_flags = cppcheck:--enable=all --suppress=unusedFunction
check_src_filters = +<src/app/*.c>
build_type = debug
debug_init_cmds = target extended-remote $DEBUG_PORT
                  $LOAD_CMDS
                  $INIT_BREAK

; основное приложение, запуск из AXI-SRAM, исходные коды в src/app/*
[env:app_in_ram]
build_src_filter = +<app/*.c> +<$PROJECT_DIR/system/*>
board_build.ldscript = $PROJECT_DIR/system/stm32h745xx_sram1_CM7.ld
build_flags = ${env.build_flags} -D VECT_TAB_SRAM -D USER_VECT_TAB_ADDRESS
upload_protocol = custom ; загрузка не во FLASH, а в AXI-SRAM
; upload_command записывается одной строкой, без переносов
upload_command = openocd -f interface/stlink.cfg -f target/stm32h7x_dual_bank.cfg -c "init; halt; load_image .pio/build/app_in_ram/firmware.bin 0x24000000; verify_image .pio/build/app_in_ram/firmware.bin 0x24000000; reset; exit"

; основное приложение, запуск из FLASH, вместо загрузчика
[env:app_in_flash]
build_src_filter = +<app/*.c> +<$PROJECT_DIR/system/*>
board_build.ldscript = $PROJECT_DIR/system/STM32H745ZITX_M7_FLASH.ld

; загрузчик, запуск из FLASH BANK-1; умеет запускать приложение из AXI-SRAM
[env:bootloader]
build_src_filter = +<bootloader/*.c> +<$PROJECT_DIR/system/*>
check_src_filters = +<src/bootloader/*.c>
board_build.ldscript = $PROJECT_DIR/system/stm32h745xx_flash_CM7.ld
